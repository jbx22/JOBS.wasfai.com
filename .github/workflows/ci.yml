name: JOBS checks
on:
  pull_request:
  push:
    branches: [main, "codex/**"]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jobs_test
          POSTGRES_PASSWORD: jobs_test_only
          POSTGRES_DB: jobs_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jobs_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      JOBS_TEST_PG_URL: postgres://jobs_test:jobs_test_only@127.0.0.1:5432/jobs_test
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm install --prefix vps/db-gateway --ignore-scripts --no-audit --no-fund
      - run: npm run check:all
      - run: node --test vps/db-gateway/test/sql.test.mjs
      - name: Build the Pages upload
        run: bash .github/scripts/stage-pages.sh

  deploy:
    name: Deploy Cloudflare Pages
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'jbx22/JOBS.wasfai.com'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    environment:
      name: production
      url: https://jobs.wasfai.com
    concurrency:
      group: jobs-wasfai-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Check current main commit
        id: current
        run: |
          main_sha=$(git ls-remote --exit-code origin refs/heads/main | cut -f1)
          if [[ "$main_sha" == "$GITHUB_SHA" ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Skipping this commit because main has advanced to $main_sha."
          fi
      - name: Stage the tested commit
        if: steps.current.outputs.deploy == 'true'
        run: bash .github/scripts/stage-pages.sh
      - name: Publish the tested commit
        if: steps.current.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          : "${CLOUDFLARE_API_TOKEN:?Configure CLOUDFLARE_API_TOKEN for production}"
          : "${CLOUDFLARE_ACCOUNT_ID:?Configure CLOUDFLARE_ACCOUNT_ID for production}"
          node .github/scripts/pages-bindings.mjs before
          (
            cd "$PAGES_STAGE"
            "$GITHUB_WORKSPACE/node_modules/.bin/wrangler" pages deploy site --no-bundle \
              --project-name jobs-wasfai --branch main --commit-hash "$GITHUB_SHA"
          )
          node .github/scripts/pages-bindings.mjs after
      - name: Verify the public release
        if: steps.current.outputs.deploy == 'true'
        run: |
          expected=$(node -p "'jobs' + require('./VERSION.json').current")
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --max-time 10 "https://jobs.wasfai.com/api/version?commit=$GITHUB_SHA" |
              jq -e --arg release "$expected" '.release == $release' >/dev/null; then
              echo "Verified $expected on jobs.wasfai.com"
              exit 0
            fi
            sleep 5
          done
          echo "::error::The public site did not report $expected."
          exit 1
